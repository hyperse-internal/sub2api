# Self-hosted: tools.alphaio.vip → WorkBuddy2API-Hub (wb-proxy :8788)
# Upstream: /opt/workbuddy2api + systemd workbuddy2api.service
# SSL: /opt/workbuddy2api/ssl/tools.alphaio.vip.{pem,key}

upstream workbuddy2api_backend {
  server 127.0.0.1:8788;
  keepalive 32;
}

# HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name tools.alphaio.vip;

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name tools.alphaio.vip;

  ssl_certificate     /opt/workbuddy2api/ssl/tools.alphaio.vip.pem;
  ssl_certificate_key /opt/workbuddy2api/ssl/tools.alphaio.vip.key;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TOOLS_SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 32m;

  access_log /var/log/nginx/tools.alphaio.vip.access.log;
  error_log  /var/log/nginx/tools.alphaio.vip.error.log;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_pass http://workbuddy2api_backend;
    proxy_redirect off;

    # SSE / 流式响应
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;
  }

  location = /health {
    proxy_pass http://workbuddy2api_backend/health;
    access_log off;
  }
}
